#To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.

name: 🎭 Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:e2e"
      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"
      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: ⚙️ Create .env File
        run: |
          cp .env.example .env
          cat >> .env << 'ENVEOF'
          APP_EMAIL=${{ secrets.APP_EMAIL }}
          APP_PASSWORD=${{ secrets.APP_PASSWORD }}
          USERNAME=${{ secrets.API_USERNAME }}
          PASSWORD=${{ secrets.API_PASSWORD }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ENVEOF

      - name: 🧪 Run Playwright Tests
        env:
          CI: "1"
          TEST_SUITE: ${{ inputs.test_suite || 'test:e2e' }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          RUN_MODE: ${{ inputs.mode || 'headless' }}
        run: |
          suite="${TEST_SUITE:-test:e2e}"
          browser="${BROWSER:-chromium}"
          mode="${RUN_MODE:-headless}"
          tag="${suite#test:}"
          if [ "$tag" = "e2e" ]; then
            tag="(e2e|end-to-end)"
          fi
          browserFlag="--project=$browser"
          modeFlag=""
          if [ "$mode" = "headed" ]; then
            modeFlag="--headed"
          fi
          npx playwright test --grep "@$tag" $browserFlag $modeFlag --output=test-results

      - name: 📁 Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/
          retention-days: 30

      - name: 📜 Output Logs to Action Summary
        if: always()
        run: |
          if [ -d logs ] && ls logs/*.log 1> /dev/null 2>&1; then
            echo "### 📋 Test Execution Logs" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat logs/*.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: 📸 Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
